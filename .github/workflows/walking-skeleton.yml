name: Walking skeleton

# H-01 / H-04 — MVP walking skeleton + doctor/plugin in CI; H-02 boundary audit.
# Expects sibling repos under the same GitHub owner (file: deps).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  boundary:
    name: H-02 core dependency boundary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opoha-core
    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          path: opoha-core
      - name: Checkout toolkit (file: deps)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/opoha-devkit
          path: opoha-devkit
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: opoha-core/pnpm-lock.yaml
      - name: Install
        run: pnpm install
      - name: Boundary audit
        run: pnpm test:boundary

  walking-skeleton:
    name: H-01/H-04 walking skeleton + doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opoha-core
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opoha
          POSTGRES_PASSWORD: opoha
          POSTGRES_DB: opoha
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opoha -d opoha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opoha:opoha@localhost:5433/opoha
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-walking-skeleton-secret-not-for-prod
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: change-me-in-local-dev
      PORT: '4000'
      NODE_ENV: development
      SKIP_DOCKER: '1'
    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          path: opoha-core
      - name: Checkout toolkit (file: deps)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/opoha-devkit
          path: opoha-devkit
      - name: Checkout CLI (doctor + plugin install)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/opoha-cli
          path: opoha-cli
      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/opoha-plugin-sdk
          path: opoha-plugin-sdk
      - name: Checkout plugin-manual-payment
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/plugin-manual-payment
          path: plugin-manual-payment
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            opoha-core/pnpm-lock.yaml
            opoha-cli/pnpm-lock.yaml
            opoha-plugin-sdk/pnpm-lock.yaml
            plugin-manual-payment/pnpm-lock.yaml
      - name: Prepare .env
        run: |
          cp .env.example .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "SEED_ADMIN_EMAIL=$SEED_ADMIN_EMAIL" >> .env
          echo "SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD" >> .env
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "REDIS_URL=$REDIS_URL" >> .env
      - name: Build CLI
        working-directory: opoha-cli
        run: |
          pnpm install
          pnpm build
      - name: Build plugin-sdk + manual-payment
        working-directory: plugin-manual-payment
        run: |
          pnpm install --dir ../opoha-plugin-sdk
          pnpm --dir ../opoha-plugin-sdk build
          pnpm install
          pnpm build
      - name: Walking skeleton (incl. doctor + plugin)
        run: pnpm walking-skeleton
